<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanuar</title>
<meta name="description" content="Маленький волшебный сад для Sanuar">
<meta name="theme-color" content="#080A09">
<meta property="og:title" content="Sanuar">
<meta property="og:description" content="Рядом с тобой я чувствую спокойствие">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%23080A09'/%3E%3Cpath fill='%23ffb3cf' d='M4 3h2v2h1V3h2v2h1V3h2v6h-1v1H9v1H7v-1H5V9H4z'/%3E%3Cpath fill='%237fcf8f' d='M7 11h2v3H7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080A09;
    --pink: #ffb3cf;
    --pink-deep: #ff8fb8;
    --cream: #fff1dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2.6vh, 30px);
    padding: clamp(16px, 4vh, 44px) 14px;
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .frame {
    position: relative;
    width: max(280px, min(92vw, 900px, calc((100vh - 290px) * 1.5)));
    width: max(280px, min(92vw, 900px, calc((100svh - 290px) * 1.5)));
    aspect-ratio: 3 / 2;
    border-radius: clamp(18px, 3vw, 30px);
    overflow: hidden;
    background:
      radial-gradient(70% 55% at 50% 72%, rgba(255, 150, 190, 0.045), transparent 70%),
      radial-gradient(120% 90% at 50% 80%, #101512 0%, #0b0e0c 48%, #090b0a 100%);
    box-shadow:
      0 0 0 1px rgba(255, 220, 235, 0.06),
      0 40px 90px -30px rgba(0, 0, 0, 0.9),
      0 0 140px -40px rgba(255, 150, 190, 0.22);
    touch-action: manipulation;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.025);
  }
  .frame canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  @media (max-aspect-ratio: 4/5) {
    .frame {
      aspect-ratio: 4 / 5;
      width: max(260px, min(92vw, 560px, calc((100vh - 270px) * 0.8)));
      width: max(260px, min(92vw, 560px, calc((100svh - 270px) * 0.8)));
    }
  }

  .words {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(6px, 1.2vh, 12px);
  }

  .name {
    font-family: 'Great Vibes', 'Brush Script MT', 'Segoe Script', cursive;
    font-weight: 400;
    font-size: clamp(60px, 11vw, 118px);
    line-height: 1.05;
    letter-spacing: 0.01em;
  }
  .name span {
    display: inline-block;
    padding: 0.04em 0.22em 0.12em;
    background: linear-gradient(180deg, #ffe1ec 0%, #ffb6d0 45%, #ff93bd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 140, 185, 0.45)) drop-shadow(0 0 34px rgba(255, 120, 175, 0.25));
  }

  .line {
    font-style: italic;
    font-weight: 300;
    font-size: clamp(19px, 2.6vw, 27px);
    letter-spacing: 0.02em;
    color: rgba(255, 241, 220, 0.84);
    max-width: 22em;
    padding: 0 8px;
  }

  .replay {
    margin-top: clamp(8px, 1.6vh, 16px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: #ffd9e6;
    background: rgba(255, 182, 208, 0.06);
    border: 1px solid rgba(255, 182, 208, 0.3);
    border-radius: 999px;
    padding: 9px 20px 10px;
    cursor: pointer;
    transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .replay svg { width: 14px; height: 14px; transition: transform 0.8s ease; }
  .replay:hover, .replay:focus-visible {
    background: rgba(255, 182, 208, 0.12);
    border-color: rgba(255, 182, 208, 0.55);
    box-shadow: 0 0 24px rgba(255, 150, 190, 0.25);
    color: #fff0f5;
    outline: none;
  }
  .replay:hover svg { transform: rotate(-180deg); }
  .replay:active { transform: scale(0.97); }

  .reveal {
    opacity: 0;
    transform: translateY(12px);
    filter: blur(6px);
    transition: opacity 1.8s ease, transform 1.8s cubic-bezier(.2,.7,.2,1), filter 1.8s ease;
  }
  .reveal.show { opacity: 1; transform: none; filter: none; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: opacity 0.6s ease; transform: none; filter: none; }
  }
</style>
</head>
<body>

  <div class="frame" id="frame">
    <canvas id="garden" role="img" aria-label="Пиксельный сад: розовые тюльпаны, цветочная звезда и светящаяся бабочка"></canvas>
  </div>

  <div class="words">
    <h1 class="name reveal" id="name"><span>Sanuar</span></h1>
    <p class="line reveal" id="line">Рядом с тобой я чувствую спокойствие</p>
    <button class="replay reveal" id="replay" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Повторить анимацию
    </button>
  </div>

<script>
(() => {
  'use strict';

  /* ---------- canvases ---------- */
  const frameEl = document.getElementById('frame');
  const canvas = document.getElementById('garden');
  const ctx = canvas.getContext('2d');
  const scene = document.createElement('canvas');
  const sctx = scene.getContext('2d');
  const bloomA = document.createElement('canvas');
  const actx = bloomA.getContext('2d');
  const bloomB = document.createElement('canvas');
  const bctx = bloomB.getContext('2d');

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let R = mulberry32(1);

  const C = {
    pinkDeep: [244, 106, 158], pink: [255, 146, 188], pinkSoft: [255, 188, 212], pinkPale: [255, 222, 234],
    cream: [255, 243, 224], gold: [255, 210, 135], goldDeep: [242, 178, 92], white: [255, 255, 255],
    peach: [255, 196, 178],
    g0: [34, 86, 58], g1: [52, 120, 78], g2: [86, 162, 104], g3: [130, 204, 132], g4: [186, 236, 176]
  };
  const PINK = [C.pinkDeep, C.pink, C.pinkSoft, C.pinkPale, C.cream];
  const GREEN = [C.g0, C.g1, C.g2, C.g3, C.g4];
  function ramp(stops, t) {
    t = clamp(t, 0, 1) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t));
    return mix(stops[i], stops[i + 1], t - i);
  }
  function jitter(c, amt) {
    const j = (R() - 0.5) * amt;
    return [clamp(c[0] + j, 0, 255), clamp(c[1] + j, 0, 255), clamp(c[2] + j, 0, 255)];
  }

  /* ---------- state ---------- */
  let cssW = 0, cssH = 0, dpr = 1, cell = 1, cols = 0, rows = 0, cs = 1;
  let cx = 0, ground = 0;
  let pts = [], plants = [], heads = [], bf = [], ambient = [], petals = [], dust = [];
  const bHome = { x: 0, y: 0 };
  const B = { x: 0, y: 0, prevX: 0, tilt: 0, w: 0, tx: 0, ty: 0, until: -1 };
  const BSTART = 5.4;
  let T = reduceMotion ? 40 : 0;   // time since the garden started assembling
  let clock = 0;                   // global time for idle loops
  let last = performance.now();
  let lastCol = '';
  let petalTimer = 1.5;
  let revealed = false;

  /* ---------- scene building ---------- */
  function mkPlant(bx, by, H, amp, ph) {
    const p = { bx, by, H, amp, ph, S: 0, th: 0 };
    plants.push(p);
    return p;
  }

  function P(o) {
    const sr = o.sr == null ? 30 : o.sr;
    const p = {
      ax: o.ax, ay: o.ay, rx: o.rx || 0, ry: o.ry || 0,
      pl: o.pl || null, f: o.f || 0, hf: o.hf || 0,
      c: rgb(o.col), a: o.a == null ? 0.92 : o.a,
      tw: 0.7 + R() * 2.2, ph: R() * TAU,
      spk: R() < 0.12 ? 0.6 : 0.16,
      fl: R() < 0.025,
      d: o.d || 0, du: o.du || 1.2,
      sr, sx: 0, sy: 0,
      wv: (R() - 0.5) * Math.min(12, sr * 0.4)
    };
    pts.push(p);
    return p;
  }

  function collect(x0, x1, y0, y1, test) {
    const m = new Map();
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      const r = test(i, j);
      if (r) m.set(i + ',' + j, { i, j, r });
    }
    return m;
  }
  const isRim = (m, i, j) =>
    !m.has((i + 1) + ',' + j) || !m.has((i - 1) + ',' + j) || !m.has(i + ',' + (j + 1)) || !m.has(i + ',' + (j - 1));

  function bez(b, t2, bend, t) {
    const qx = (b.x + t2.x) / 2 + bend, qy = (b.y + t2.y) / 2;
    const u = 1 - t;
    return { x: u * u * b.x + 2 * u * t * qx + t * t * t2.x, y: u * u * b.y + 2 * u * t * qy + t * t * t2.y };
  }

  function stem(pl, b, top, bend, thick, d0, dGrow, shade) {
    const seen = new Set();
    const n = Math.ceil(Math.hypot(top.x - b.x, top.y - b.y) * 2.2);
    for (let k = 0; k <= n; k++) {
      const q = bez(b, top, bend, k / n);
      for (let w = 0; w < thick; w++) {
        const i = Math.round(q.x) + w, j = Math.round(q.y);
        const key = i + ',' + j;
        if (seen.has(key)) continue;
        seen.add(key);
        const h = clamp((b.y - j) / (b.y - top.y), 0, 1);
        const col = jitter(ramp(GREEN, (shade || 0.35) + w * 0.22 + h * 0.22 + R() * 0.08), 10);
        P({ ax: i, ay: j, pl, f: Math.pow(h, 1.6), col, a: 0.9, d: d0 + h * dGrow + R() * 0.15, du: 0.7, sr: 3 });
      }
    }
  }

  function leaf(pl, b, top, bend, hfrac, dir, L, Wd, ang, droop, d0) {
    const pt = bez(b, top, bend, hfrac);
    const ux = dir * Math.cos(ang), uy = -Math.sin(ang);
    let px = -uy, py = ux;
    if (py < 0) { px = -px; py = -py; }
    const ox = Math.round(pt.x), oy = Math.round(pt.y);
    const span = Math.ceil(L) + 3;
    const m = collect(-span, span, -span, span, (i, j) => {
      const dx = ox + i - pt.x, dy = oy + j - pt.y;
      const u = dx * ux + dy * uy, v = dx * px + dy * py;
      const un = u / L;
      if (un < 0 || un > 1) return null;
      const center = droop * L * un * un * 0.35;
      const w = Math.max(0.55 * (1 - un * 3), Wd * Math.pow(Math.sin(Math.PI * Math.pow(un, 0.8)), 0.8));
      const dv = (v - center) / Math.max(w, 0.01);
      if (Math.abs(dv) > 1) return null;
      return { un, dv };
    });
    const f0 = Math.pow(hfrac, 1.6);
    m.forEach(c => {
      const { un, dv } = c.r;
      let l = 0.32 + 0.34 * (1 - Math.abs(dv)) + (dv < 0 ? 0.12 : 0) + 0.12 * un + R() * 0.1;
      if (Math.abs(dv) < 0.2 && un > 0.08 && un < 0.9) l = 0.86;
      if (isRim(m, c.i, c.j)) l += 0.12;
      P({ ax: ox + c.i, ay: oy + c.j, pl, f: f0 + un * 0.22, col: jitter(ramp(GREEN, l), 8), a: 0.88,
          d: d0 + un * 0.7 + R() * 0.25, du: 1.0, sr: 8 });
    });
  }

  function tulip(pl, ax, ay, Ht, hw, tone, d0) {
    const W = Math.ceil(hw) + 1;
    const m = collect(-W, W, -1, Ht + 1, (i, j) => {
      const vn = j / Ht, un = i / hw;
      if (vn < -0.03) return null;
      const q = (vn - 0.55) / 0.62;
      const wv = 1 - q * q;
      if (wv <= 0) return null;
      if (Math.abs(un) > Math.sqrt(wv)) return null;
      const au = Math.abs(un);
      const top = 1 - 0.21 * Math.exp(-Math.pow((au - 0.42) / 0.14, 2)) - 0.06 * au;
      if (vn > top) return null;
      return { un, vn, au };
    });
    m.forEach(c => {
      const { un, vn, au } = c.r;
      let l = 0.42 - 0.3 * au + 0.34 * vn;
      l += 0.2 * Math.exp(-Math.pow((un + 0.33) / 0.17, 2)) * (vn > 0.18 && vn < 0.86 ? 1 : 0.3);
      if (vn < 0.8) l -= 0.22 * Math.exp(-Math.pow((au - 0.42) / 0.07, 2));
      if (vn < 0.14) l -= 0.1;
      if (isRim(m, c.i, c.j)) l += 0.16;
      l += (R() - 0.5) * 0.12 + tone * 0.06;
      let col = ramp(PINK, l);
      if (tone) col = mix(col, C.peach, 0.22);
      if (R() < 0.035) col = C.pinkPale;
      P({ ax, ay, rx: c.i, ry: -c.j, pl, f: 1, hf: 1, col: jitter(col, 8), a: 0.95,
          d: d0 + vn * 0.7 + R() * 0.7, du: 1.5 + R() * 0.8, sr: 18 + R() * 30 });
    });
    heads.push({ pl, ax, ay: ay - Ht * 0.6, w: hw * 1.6, h: Ht * 0.7 });
  }

  function starFlower(pl, ax, ay, Rr, d0) {
    const outer = th => Rr * (0.4 + 0.6 * Math.pow(Math.abs(Math.cos(2.5 * th)), 1.2));
    const inner = th => Rr * 0.6 * (0.42 + 0.58 * Math.pow(Math.abs(Math.cos(2.5 * (th + Math.PI / 5))), 1.1));
    const W = Math.ceil(Rr) + 1;
    const m = collect(-W, W, -W, W, (i, j) => {
      const r = Math.hypot(i, j);
      const th = Math.atan2(j, i) + Math.PI / 2;
      const ro = outer(th), ri = inner(th);
      if (r > ro && r > ri) return null;
      return { r, th, ro, ri, inIn: r <= ri };
    });
    m.forEach(c => {
      const { r, th, ro, inIn } = c.r;
      const radial = r / Rr;
      let col, a = 0.95;
      if (radial < 0.15) {
        col = R() < 0.3 ? C.cream : mix(C.goldDeep, C.gold, R());
      } else if (radial < 0.25) {
        col = (c.i + c.j) % 2 === 0 ? C.gold : mix(C.cream, C.pinkPale, 0.5);
      } else {
        const petal = Math.pow(Math.abs(Math.cos(2.5 * th)), 1.2);
        let l;
        if (inIn) {
          l = 0.78 - 0.45 * radial;
        } else {
          l = 0.62 - 0.5 * (r / ro) + 0.1;
          if (petal > 0.96 && radial > 0.3) l += 0.16;
          if (petal < 0.25) l -= 0.08;
        }
        if (isRim(m, c.i, c.j)) l = Math.max(l, 0.62) + 0.06;
        l += (R() - 0.5) * 0.1;
        col = ramp(PINK, l);
        if (R() < 0.03) col = C.white;
      }
      P({ ax, ay, rx: c.i, ry: c.j, pl, f: 1, hf: 0.7, col: jitter(col, 8), a,
          d: d0 + radial * 1.0 + R() * 0.45, du: 1.5 + R() * 0.7, sr: 20 + R() * 32 });
    });
    heads.push({ pl, ax, ay, w: Rr * 1.4, h: Rr * 1.4 });
  }

  function smallFlower(pl, ax, ay, s, d0) {
    const rot = R() * TAU;
    const pr = 0.75 * s + 0.3;
    const centers = [];
    for (let k = 0; k < 5; k++) {
      const a = rot + k * TAU / 5;
      centers.push([Math.cos(a) * 1.5 * s, Math.sin(a) * 1.5 * s]);
    }
    const W = Math.ceil(3 * s);
    const m = collect(-W, W, -W, W, (i, j) => {
      if (Math.hypot(i, j) <= 0.75) return { c: 1 };
      for (const q of centers) if (Math.hypot(i - q[0], j - q[1]) <= pr) return { c: 0 };
      return null;
    });
    m.forEach(c => {
      const col = c.r.c ? C.gold : (R() < 0.25 ? C.cream : (R() < 0.12 ? C.pinkPale : C.white));
      P({ ax, ay, rx: c.i, ry: c.j, pl, f: 1, hf: 1, col, a: 0.95,
          d: d0 + R() * 0.6, du: 1.2, sr: 10 + R() * 16 });
    });
  }

  function grass(fade, hMul, dBase) {
    const half = cols / 2;
    for (let x = 0.5; x < cols; x += 0.55 + R() * 0.7) {
      const dist = Math.min(1, Math.abs(x - cx) / half);
      const hmax = lerp(13, 4, Math.pow(dist, 1.3)) * hMul;
      const h = Math.max(2, hmax * (0.35 + 0.65 * R()));
      const lean = (R() - 0.5) * 0.9;
      const by = ground + 2;
      const pl = mkPlant(x, by, h, 0.3 + h * 0.06, x * 0.07 + R() * 0.6);
      const fa = (1 - dist * 0.55) * fade;
      const steps = Math.ceil(h);
      const seen = new Set();
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        const px = Math.round(x + lean * h * t * t), py = Math.round(by - h * t);
        const key = px + ',' + py;
        if (seen.has(key)) continue;
        seen.add(key);
        P({ ax: px, ay: py, pl, f: Math.pow(t, 1.5), col: jitter(ramp(GREEN, 0.12 + t * 0.8 + (R() - 0.5) * 0.2), 10),
            a: (0.45 + 0.45 * t) * fa, d: dBase + R() * 1.2 + t * 0.5, du: 1.0, sr: 4 });
      }
    }
  }

  function inEll(x, y, ecx, ecy, a, b, rot) {
    const dx = x - ecx, dy = y - ecy, c = Math.cos(rot), s = Math.sin(rot);
    const u = dx * c + dy * s, v = -dx * s + dy * c;
    return (u * u) / (a * a) + (v * v) / (b * b);
  }

  function butterfly() {
    bf = [];
    const m = collect(1, 22, -17, 15, (i, j) => {
      const q1 = inEll(i, j, 9, -6, 10, 7.5, -0.5);
      if (q1 < 1) return { w: 1, q: q1 };
      const q2 = inEll(i, j, 6.5, 6, 6.5, 5, 0.6);
      if (q2 < 1) return { w: 2, q: q2 };
      return null;
    });
    const veins = [-0.15, -0.55, -0.95, 0.55, 0.95];
    const add = (lx, ly, col, a, ant, extraD) => {
      const d = BSTART + R() * 0.9 + (extraD || 0);
      bf.push({ lx, ly, c: rgb(col), a, ant: !!ant, d, du: 1.6 + R() * 0.6,
                tw: 0.8 + R() * 2.4, ph: R() * TAU, spk: R() < 0.15 ? 0.5 : 0.14, fl: R() < 0.04,
                sx: 0, sy: 0, wv: (R() - 0.5) * 12 });
    };
    m.forEach(c => {
      if (R() < 0.05) return;
      const { i, j } = c;
      const rho = Math.hypot(i, j) / 19;
      let col = mix([255, 214, 162], C.pink, clamp(rho * 1.25, 0, 1));
      col = mix(col, [246, 170, 222], clamp((rho - 0.7) * 1.5, 0, 0.35));
      const ang = Math.atan2(j, i);
      if (c.r.q < 0.82) for (const va of veins) if (Math.abs(ang - va) < 0.06 && rho > 0.12) col = mix(col, [196, 86, 138], 0.35);
      if (Math.hypot(i - 13.5, j + 9) < 1.9 || Math.hypot(i - 16.5, j + 4.5) < 1.1) col = C.white;
      if (Math.hypot(i - 8.5, j - 8) < 1.3) col = C.cream;
      if (c.r.q > 0.8 || isRim(m, i, j)) col = (i + j) % 2 === 0 ? [255, 246, 236] : mix(C.pinkPale, C.gold, 0.3);
      col = jitter(col, 8);
      const dd = rho * 0.4;
      add(i, j, col, 0.95, false, dd);
      add(-i, j, col, 0.95, false, dd);
    });
    for (let j = -6; j <= 8; j++) add(0, j, j < -4 ? C.gold : mix(C.cream, C.goldDeep, (j + 6) / 14), 1, false, 0.2);
    add(0, -7, C.cream, 1, false, 0.2);
    for (const s of [-1, 1]) {
      for (let k = 1; k <= 7; k++) {
        const t = k / 7;
        const x = s * (1.2 * t + 3.6 * t * t), y = -7 - 7 * t + 1.2 * t * t;
        add(x, y, k === 7 ? C.gold : mix(C.cream, C.gold, t), k === 7 ? 1 : 0.8, true, 0.4);
      }
    }
  }

  function build() {
    R = mulberry32(73191);
    pts = []; plants = []; heads = [];
    cx = cols / 2;
    ground = rows - 5;
    const extra = Math.max(0, rows - 140);
    const xs = 1 + 0.18 * clamp((cols - 140) / 80, 0, 1);
    const X = v => Math.round(cx + v * xs);

    grass(0.55, 0.65, 0.1);

    { // left tulip
      const b = { x: X(-30), y: ground + 2 }, top = { x: X(-36), y: ground - 78 }, bend = 7;
      const pl = mkPlant(b.x, b.y, 80, 1.9, 0.0);
      stem(pl, b, top, bend, 2, 0.6, 1.7);
      leaf(pl, b, top, bend, 0.2, -1, 23, 4.2, 1.0, 0.45, 1.3);
      leaf(pl, b, top, bend, 0.4, 1, 16, 3.3, 1.1, 0.3, 1.6);
      tulip(pl, top.x, top.y, 21, 8.5, 0, 2.1);
    }
    { // star flower
      const b = { x: X(2), y: ground + 2 }, top = { x: X(4), y: ground - 58 }, bend = -6;
      const pl = mkPlant(b.x, b.y, 60, 1.5, 1.7);
      stem(pl, b, top, bend, 2, 0.8, 1.6);
      leaf(pl, b, top, bend, 0.18, 1, 18, 3.8, 0.75, 0.6, 1.5);
      leaf(pl, b, top, bend, 0.34, -1, 14, 3.2, 0.85, 0.5, 1.8);
      starFlower(pl, top.x, top.y, 17, 2.6);
    }
    { // right tulip
      const b = { x: X(32), y: ground + 2 }, top = { x: X(38), y: ground - 50 }, bend = -7;
      const pl = mkPlant(b.x, b.y, 52, 1.6, 3.1);
      stem(pl, b, top, bend, 2, 0.7, 1.5);
      leaf(pl, b, top, bend, 0.26, 1, 18, 3.8, 1.0, 0.5, 1.4);
      leaf(pl, b, top, bend, 0.16, -1, 12, 2.8, 0.9, 0.4, 1.6);
      tulip(pl, top.x, top.y, 18, 7.5, 1, 2.4);
    }

    const small = [[-50, 14, 1.2], [-22, 24, 1.3], [-13, 9, 1], [17, 17, 1.2], [26, 32, 1.35], [52, 12, 1.1],
                   [-58, 6, 1], [9, 7, 1], [-49, 40, 1.25], [47, 27, 1.2], [-4, 19, 1], [61, 21, 1], [-66, 16, 1.1]];
    for (const s of small) {
      const fx = X(s[0]), fy = ground - s[1];
      const b = { x: fx + Math.round((R() - 0.5) * 3), y: ground + 2 };
      const pl = mkPlant(b.x, b.y, s[1], 0.6 + s[1] * 0.03, R() * TAU);
      const bend = (R() - 0.5) * 4;
      stem(pl, b, { x: fx, y: fy }, bend, 1, 1.8 + R() * 0.8, 0.9, 0.25);
      smallFlower(pl, fx, fy, s[2], 3.6 + R() * 1.1);
    }

    grass(1, 1, 0.3);

    // tiny white buds in the grass
    for (let k = 0; k < 22; k++) {
      const x = Math.round(cx + (R() - 0.5) * cols * 0.85);
      const y = ground - Math.round(R() * 4);
      const pl = mkPlant(x, ground + 2, 4, 0.5, R() * TAU);
      P({ ax: x, ay: y, pl, f: 1, col: R() < 0.7 ? C.white : C.cream, a: 0.85, d: 3.8 + R() * 1.4, du: 1.0, sr: 10 });
    }

    bHome.x = cx + 12 * xs;
    bHome.y = ground - 104 - extra * 0.4;
    butterfly();

    ambient = [];
    const n = Math.round((cols * rows) / 250);
    const palette = [C.white, C.cream, C.gold, C.pinkPale, C.pinkSoft, C.g4];
    for (let i = 0; i < n; i++) {
      ambient.push({
        x: Math.random() * cols, y: Math.random() * rows,
        sp: 0.2 + Math.random() * 0.9, tw: 0.4 + Math.random() * 1.8, ph: Math.random() * TAU,
        amax: 0.3 + Math.random() * 0.65, drift: 0.6 + Math.random() * 1.6,
        c: rgb(palette[(Math.random() * palette.length) | 0]), cross: Math.random() < 0.22
      });
    }
    scatter();
  }

  function scatter() {
    for (const p of pts) {
      const a = Math.random() * TAU, r = p.sr * (0.25 + 0.75 * Math.random());
      const x = p.ax + p.rx, y = p.ay + p.ry;
      p.sx = clamp(x + Math.cos(a) * r, 1, cols - 1);
      p.sy = clamp(y + Math.sin(a) * r * 0.8 + (p.sr <= 4 ? 2 : 0), 1, rows - 1);
    }
    for (const p of bf) {
      const a = Math.random() * TAU, r = 14 + Math.random() * 30;
      p.sx = clamp(bHome.x + Math.cos(a) * r, 1, cols - 1);
      p.sy = clamp(bHome.y + Math.sin(a) * r * 0.7, 1, rows - 1);
    }
  }

  /* ---------- sizing ---------- */
  function resize() {
    const rect = frameEl.getBoundingClientRect();
    const w = Math.round(rect.width), h = Math.round(rect.height);
    if (w === cssW && h === cssH) return;
    cssW = w; cssH = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(h * dpr));
    canvas.width = scene.width = W;
    canvas.height = scene.height = H;
    bloomA.width = Math.max(1, Math.round(W / 4)); bloomA.height = Math.max(1, Math.round(H / 4));
    bloomB.width = Math.max(1, Math.round(W / 12)); bloomB.height = Math.max(1, Math.round(H / 12));
    cell = Math.min(w, h) / 140;
    cols = w / cell; rows = h / cell;
    cs = cell * dpr;
    build();
  }

  /* ---------- drawing ---------- */
  function plot(p, x, y, base) {
    const k = (T - p.d) / p.du;
    let a = base, sz = cs * 0.84, col = p.c;
    if (k < 1) {
      if (k <= 0) {
        const pre = 1 + (T - p.d) / 1.3;
        if (pre <= 0) return;
        x = p.sx + Math.sin(clock * 0.8 + p.ph) * 0.7;
        y = p.sy + Math.cos(clock * 0.6 + p.ph) * 0.7;
        a = 0.3 * pre * (0.55 + 0.45 * Math.sin(clock * p.tw * 2 + p.ph));
        sz *= 0.55;
      } else {
        const e = easeInOut(k), sw = Math.sin(k * Math.PI) * p.wv;
        const dx = x - p.sx, dy = y - p.sy, L = Math.hypot(dx, dy) || 1;
        x = p.sx + dx * e + (-dy / L) * sw;
        y = p.sy + dy * e + (dx / L) * sw;
        a = Math.min(1, 0.35 + 0.6 * e + 0.3 * Math.sin(k * Math.PI));
        sz *= 0.55 + 0.45 * e;
      }
    } else if (k < 1.7) {
      a = Math.min(1, a + ((1.7 - k) / 0.7) * 0.55);
    } else if (p.fl) {
      if (Math.sin(clock * p.tw * 0.7 + p.ph) > 0.93) { col = '#ffffff'; a = 1; }
    }
    if (a <= 0.01) return;
    sctx.globalAlpha = a;
    if (col !== lastCol) { sctx.fillStyle = col; lastCol = col; }
    sctx.fillRect(x * cs - sz / 2, y * cs - sz / 2, sz, sz);
  }

  function drawPoints() {
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], pl = p.pl;
      let x = p.ax + p.rx, y = p.ay + p.ry;
      if (pl) {
        x += pl.S * p.f;
        if (p.hf) { const th = pl.th * p.hf; x -= p.ry * th; y += p.rx * th; }
      }
      const tw = 1 - p.spk * 0.5 + p.spk * 0.5 * Math.sin(clock * p.tw + p.ph);
      plot(p, x, y, p.a * tw);
    }
  }

  function updateButterfly(dt) {
    const t = clock;
    let px = bHome.x + 15 * Math.sin(t * 0.23) + 5 * Math.sin(t * 0.57 + 1);
    let py = bHome.y + 6 * Math.sin(t * 0.41 + 0.5) + 3 * Math.sin(t * 0.97);
    const want = clock < B.until ? 1 : 0;
    B.w += (want - B.w) * Math.min(1, dt * 0.9);
    if (B.w > 0.001) {
      const ox = B.tx + Math.sin(t * 0.9) * 4, oy = B.ty + Math.sin(t * 1.3) * 2.5;
      const e = B.w * B.w * (3 - 2 * B.w);
      px = lerp(px, ox, e); py = lerp(py, oy, e);
    }
    B.x = px; B.y = py;
    const vx = (B.x - B.prevX) / Math.max(dt, 1e-3);
    B.prevX = B.x;
    B.tilt += (clamp(vx * 0.035, -0.3, 0.3) - B.tilt) * Math.min(1, dt * 2.5);
  }

  function drawButterfly() {
    const phi = clock * 3.6 + 0.5 * Math.sin(clock * 0.7);
    const s = 0.16 + 0.84 * (0.5 + 0.5 * Math.cos(phi));
    const bx = B.x, by = B.y + Math.sin(phi) * 0.6;
    const ca = Math.cos(B.tilt), sa = Math.sin(B.tilt);
    for (let i = 0; i < bf.length; i++) {
      const p = bf[i];
      let lx = p.lx, ly = p.ly;
      if (!p.ant && lx !== 0) { const ax = Math.abs(lx); lx *= s; ly -= ax * (1 - s) * 0.28; }
      const x = bx + lx * ca - ly * sa, y = by + lx * sa + ly * ca;
      const tw = 1 - p.spk * 0.5 + p.spk * 0.5 * Math.sin(clock * p.tw + p.ph);
      plot(p, x, y, p.a * tw * (p.ant || p.lx === 0 ? 1 : 0.5 + 0.5 * s));
    }
  }

  function drawAmbient(parity, fade) {
    const RR = rows + 4, sz = cs * 0.7;
    for (let i = parity; i < ambient.length; i += 2) {
      const s = ambient[i];
      let y = s.y - s.sp * clock;
      y = ((y % RR) + RR) % RR - 2;
      const x = s.x + Math.sin(clock * 0.27 * s.drift + s.ph) * 2;
      let a = Math.sin(clock * s.tw + s.ph);
      if (a <= 0) continue;
      a = a * a * s.amax * fade;
      const px = x * cs, py = y * cs;
      sctx.globalAlpha = a;
      if (s.c !== lastCol) { sctx.fillStyle = s.c; lastCol = s.c; }
      sctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
      if (s.cross && a > 0.3) {
        sctx.globalAlpha = a * 0.4;
        sctx.fillRect(px - sz / 2 - cs, py - sz / 2, sz, sz);
        sctx.fillRect(px - sz / 2 + cs, py - sz / 2, sz, sz);
        sctx.fillRect(px - sz / 2, py - sz / 2 - cs, sz, sz);
        sctx.fillRect(px - sz / 2, py - sz / 2 + cs, sz, sz);
      }
    }
  }

  const PETAL_BIG = [[0, 0, 1], [1, 0, 2], [0, 1, 2]];
  const PETAL_SMALL = [[0, 0, 1], [1, 0, 2]];
  function spawnPetal(x, y) {
    petals.push({
      x, y, vy: 1.3 + Math.random() * 1.6, ph: Math.random() * TAU,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 2.4, life: 0,
      c1: rgb(ramp(PINK, 0.5 + Math.random() * 0.4)), c2: rgb(ramp(PINK, 0.15 + Math.random() * 0.35)),
      big: Math.random() < 0.55
    });
  }
  function updatePetals(dt, wind) {
    if (T > 6.5 && heads.length) {
      petalTimer -= dt;
      if (petalTimer <= 0 && petals.length < 16) {
        const h = heads[(Math.random() * heads.length) | 0];
        spawnPetal(h.ax + h.pl.S + (Math.random() - 0.5) * h.w, h.ay + (Math.random() - 0.5) * h.h);
        petalTimer = 0.8 + Math.random() * 1.6;
      }
    }
    const sz = cs * 0.8;
    let w = 0;
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.life += dt;
      p.y += p.vy * dt;
      p.x += (wind * 0.9 + Math.sin(p.life * 1.4 + p.ph) * 1.3) * dt;
      p.rot += p.vr * dt;
      if (p.y > ground + 4) continue;
      petals[w++] = p;
      let a = Math.min(1, p.life / 0.6) * clamp((ground + 4 - p.y) / 6, 0, 1) * 0.92;
      const flip = Math.cos(p.life * 2 + p.ph);
      const c = Math.cos(p.rot), s = Math.sin(p.rot);
      const shape = p.big ? PETAL_BIG : PETAL_SMALL;
      for (const o of shape) {
        const rx = (o[0] - 0.4) * flip, ry = o[1] - 0.4;
        const x = p.x + rx * c - ry * s, y = p.y + rx * s + ry * c;
        sctx.globalAlpha = a * (0.75 + 0.25 * Math.abs(flip));
        const col = o[2] === 1 ? p.c1 : p.c2;
        if (col !== lastCol) { sctx.fillStyle = col; lastCol = col; }
        sctx.fillRect(x * cs - sz / 2, y * cs - sz / 2, sz, sz);
      }
    }
    petals.length = w;
  }

  function addDust(x, y, vx, vy, max, col, g) {
    if (dust.length > 340) dust.shift();
    dust.push({ x, y, vx, vy, life: 0, max, c: col, ph: Math.random() * TAU, g: g == null ? 0.4 : g });
  }
  const DUST_COLS = [C.gold, C.cream, C.pinkPale, C.white, C.pinkSoft].map(rgb);
  let dustTimer = 0;
  function updateDust(dt) {
    if (T > BSTART + 2) {
      dustTimer -= dt;
      if (dustTimer <= 0) {
        dustTimer = 0.07;
        addDust(B.x + (Math.random() - 0.5) * 14, B.y + Math.random() * 6, (Math.random() - 0.5) * 0.8,
                0.5 + Math.random() * 1.2, 1.2 + Math.random() * 1.3, DUST_COLS[(Math.random() * 3) | 0]);
      }
    }
    const sz = cs * 0.66;
    let w = 0;
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.life += dt;
      if (d.life >= d.max) continue;
      dust[w++] = d;
      d.x += d.vx * dt; d.y += d.vy * dt;
      const damp = 1 - dt * 1.2;
      d.vx *= damp; d.vy = d.vy * damp + d.g * dt;
      const k = d.life / d.max;
      const a = Math.pow(1 - k, 1.4) * (k < 0.12 ? k / 0.12 : 1) * (0.65 + 0.35 * Math.sin(clock * 9 + d.ph));
      sctx.globalAlpha = a;
      if (d.c !== lastCol) { sctx.fillStyle = d.c; lastCol = d.c; }
      sctx.fillRect(d.x * cs - sz / 2, d.y * cs - sz / 2, sz, sz);
    }
    dust.length = w;
  }

  /* ---------- interaction ---------- */
  const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  function burst(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU + Math.random() * 0.3, sp = 4 + Math.random() * 10;
      addDust(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 1 + Math.random() * 1.2,
              DUST_COLS[(Math.random() * DUST_COLS.length) | 0], 1.2);
    }
    const hc = rgb(C.pinkSoft), hl = rgb(C.pinkPale);
    for (let j = 0; j < HEART.length; j++) for (let i = 0; i < 7; i++) {
      if (HEART[j][i] !== 'X') continue;
      addDust(x + (i - 3), y + (j - 3), (Math.random() - 0.5) * 0.3, -2.2, 1.8 + Math.random() * 0.3,
              (i + j) % 3 === 0 ? hl : hc, -0.2);
    }
    if (T > 6.5) for (let k = 0; k < 2; k++) spawnPetal(x + (Math.random() - 0.5) * 6, y - 2);
    if (T > BSTART + 2) {
      B.tx = clamp(x, 20, cols - 20);
      B.ty = clamp(y - 8, 16, ground - 22);
      B.until = clock + 4.5;
    }
  }
  function toCells(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / cell, y: (e.clientY - r.top) / cell };
  }
  canvas.addEventListener('pointerdown', e => { const p = toCells(e); burst(p.x, p.y); });
  let trailT = 0;
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const now = performance.now();
    if (now - trailT < 45) return;
    trailT = now;
    const p = toCells(e);
    addDust(p.x, p.y, (Math.random() - 0.5) * 1.5, -0.5 - Math.random(), 0.9 + Math.random() * 0.8,
            DUST_COLS[(Math.random() * DUST_COLS.length) | 0], 0.3);
  });

  function restart() {
    T = reduceMotion ? 40 : 0;
    petals.length = 0;
    dust.length = 0;
    petalTimer = 1.5;
    B.until = -1;
    scatter();
  }
  document.getElementById('replay').addEventListener('click', restart);

  const nameEl = document.getElementById('name'), lineEl = document.getElementById('line'), btnEl = document.getElementById('replay');
  function reveal() {
    revealed = true;
    nameEl.classList.add('show');
    setTimeout(() => lineEl.classList.add('show'), 800);
    setTimeout(() => btnEl.classList.add('show'), 1700);
  }

  /* ---------- main loop ---------- */
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    clock += dt;
    T += dt;
    if (!revealed && T > 6.2) reveal();

    const wind = 0.75 + 0.25 * Math.sin(clock * 0.17);
    for (let i = 0; i < plants.length; i++) {
      const p = plants[i];
      p.S = p.amp * wind * (0.6 * Math.sin(clock * 0.8 + p.ph) + 0.25 * Math.sin(clock * 1.7 + p.ph * 1.6) + 0.15);
      p.th = p.S * 0.025;
    }
    updateButterfly(dt);

    const W = scene.width, H = scene.height;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, W, H);
    lastCol = '';
    const fade = clamp(clock / 2, 0, 1);

    drawAmbient(0, fade);
    drawPoints();
    updatePetals(dt, wind);
    drawButterfly();
    updateDust(dt);
    drawAmbient(1, fade);
    sctx.globalAlpha = 1;

    // compose: soft halos, crisp pixels, then two layers of bloom
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);

    const prog = clamp((T - 2) / 4, 0, 1);
    if (prog > 0) {
      const gx = cx * cs, gy = (ground - 52) * cs, gr = 78 * cs;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, 'rgba(255,150,190,' + (0.09 * prog).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,150,190,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    const bp = clamp((T - BSTART - 0.6) / 1.8, 0, 1);
    if (bp > 0) {
      const gx = B.x * cs, gy = B.y * cs, gr = 26 * cs;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, 'rgba(255,214,180,' + (0.11 * bp).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,214,180,0)');
      ctx.fillStyle = g;
      ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }

    ctx.drawImage(scene, 0, 0);

    actx.clearRect(0, 0, bloomA.width, bloomA.height);
    actx.imageSmoothingQuality = 'high';
    actx.drawImage(scene, 0, 0, bloomA.width, bloomA.height);
    bctx.clearRect(0, 0, bloomB.width, bloomB.height);
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(bloomA, 0, 0, W, H);
    ctx.globalAlpha = 0.6;
    ctx.drawImage(bloomB, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  resize();
  B.x = B.prevX = bHome.x; B.y = bHome.y;
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(frameEl);
  window.addEventListener('resize', resize);
  if (reduceMotion) reveal();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
